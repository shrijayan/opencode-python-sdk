# stainless.yml for shrijayan/opencode-python-sdk v0.2.3, written as an adopter would.
# The resource tree is drafted from the SDK's api.md by scripts/opencode/api_md_to_config.py;
# client settings follow src/opencode/_client.py. The spec comes from
# scripts/opencode/contract_to_openapi.py (ADR 0015); the models and casings between the
# ferrule: markers from scripts/opencode/config_models.py, which keeps the SDK's type names.
organization:
  name: opencode
  docs: https://opencode.ai/docs
  contact: https://github.com/shrijayan/opencode-python-sdk/issues

security:
  - basicAuth: []

security_schemes:
  basicAuth:
    type: http
    scheme: basic

client_settings:
  default_client_name: Opencode
  default_env_prefix: OPENCODE
  # Agent operations run long: ten minutes, as the SDK's own client had.
  default_timeout: PT10M
  opts:
    username:
      type: string
      nullable: true
      default: opencode
      auth:
        security_scheme: basicAuth
        role: username
    password:
      type: string
      nullable: true
      read_env: OPENCODE_PASSWORD
      auth:
        security_scheme: basicAuth
        role: password

environments:
  production: http://127.0.0.1:4096

query_settings:
  # The server reads arrays as repeated keys and objects as `location[directory]=` (deepObject).
  array_format: repeat
  nested_format: brackets

pagination:
  # `{data: [...], cursor: {next, previous}}`: message.list and session.list.
  - name: cursor_page
    type: cursor
    request:
      cursor:
        type: string
        x-stainless-pagination-property:
          purpose: next_cursor_param
    response:
      data:
        type: array
        items: {}
        x-stainless-pagination-property:
          purpose: items
      cursor:
        type: object
        properties:
          next:
            type: string
            x-stainless-pagination-property:
              purpose: next_cursor_field

targets:
  python:
    package_name: opencode
    project_name: opencode-python-sdk
    publish:
      pypi: false
    # The SDK keeps its own project files and tooling (MIT licence, uv, hatch-vcs, its release
    # workflow); these generated files are never written over or added.
    keep_files:
      - .devcontainer/Dockerfile
      - .devcontainer/devcontainer.json
      # The SDK's own CI (uv) and release workflow; not the generated rye ones.
      - .github/workflows/ci.yml
      - .github/workflows/publish-pypi.yml
      - .github/workflows/release-doctor.yml
      - .gitignore
      - .python-version
      - .release-please-manifest.json
      - .stats.yml
      - .vscode/settings.json
      - Brewfile
      - CONTRIBUTING.md
      - LICENSE
      - README.md
      - SECURITY.md
      - bin/check-release-environment
      - bin/publish-pypi
      - examples/.keep
      - noxfile.py
      - pyproject.toml
      - release-please-config.json
      - requirements-dev.lock
      - requirements.lock
      - scripts/bootstrap
      - scripts/format
      - scripts/lint
      - scripts/mock
      - scripts/test
      # The version comes from the git tag (hatch-vcs), not from release-please.
      - src/opencode/_version.py

# <ferrule:casings> written by scripts/opencode/config_models.py
custom_casings:
  id1: {initialism: true}
  lsp: {initialism: true}
  rtc: {initialism: true}
  usd: {initialism: true}
# </ferrule:casings>
readme:
  example_requests:
    default:
      type: request
      endpoint: get /api/session
      params: {}
    headline:
      type: request
      endpoint: get /api/session
      params: {}

