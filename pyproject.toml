[project]
name = "opencode-python-sdk"
dynamic = ["version"]
description = "Typed Python client for the OpenCode 2.x server API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shrijayan Rajendran" }]
keywords = ["opencode", "ai", "agents", "coding-agent", "sdk", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Framework :: Trio",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.4,<5",
  "distro>=1.7,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
  "sniffio",
  "typing-extensions>=4.14,<5",
]

[project.urls]
Homepage = "https://github.com/shrijayan/opencode-python-sdk"
Documentation = "https://shrijayan.github.io/opencode-python-sdk/"
Repository = "https://github.com/shrijayan/opencode-python-sdk"
Issues = "https://github.com/shrijayan/opencode-python-sdk/issues"
Changelog = "https://github.com/shrijayan/opencode-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pty = [
    "websockets>=14,<17",
]
aiohttp = [
    "aiohttp",
    "httpx-aiohttp>=0.1.9,<0.3",
]

[dependency-groups]
dev = [
  "dirty-equals>=0.6",
  "mypy==1.17.0",  # the version the generated code is checked with
  # pydantic 2.13 adds a model_dump parameter the runtime's override does not take yet.
  "pydantic<2.13",
  "pyright==1.1.399",  # the version the generated code is checked with
  "pytest>=8.4",
  "pytest-asyncio>=1",
  "httpx-aiohttp>=0.1.9",
  "pytest-cov>=7",
  "respx>=0.22",
  "ruff>=0.14",
  "time-machine>=2",
  "trio>=0.31",
  "websockets>=14",
]
# Pillow (via [imaging]) only ships patched releases for Python 3.11+, so docs builds need 3.11+.
docs = [
    "mkdocs-material[imaging]>=9.6; python_version >= '3.11'",
    "mkdocstrings[python]>=0.30; python_version >= '3.11'",
    "pillow>=13; python_version >= '3.11'",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version comes from the latest `vX.Y.Z` git tag, which the release workflow creates on every merge to main.
source = "vcs"
raw-options = { local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/opencode"]

[tool.hatch.build.targets.sdist]
include = ["src/opencode", "tests", "README.md", "LICENSE", "CHANGELOG.md", "api.md"]

[tool.uv]
required-version = ">=0.8"

[tool.pytest.ini_options]
# `pytest` runs the generated suite (pytest-asyncio). The hand-written tests in tests/custom use
# anyio and trio, so they run apart, with pytest-asyncio strict and without the generated conftest:
#   pytest --confcutdir=tests/custom -o asyncio_mode=strict -o addopts="-ra --strict-markers" tests/custom
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--ignore=tests/custom"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "live: runs against a real `opencode serve` process (needs the opencode CLI on PATH)",
]

[tool.coverage.run]
source = ["opencode"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

# Lint and type-check settings follow the generated code's (Ferrule, Stainless conventions): most
# of the package is generated. The hand-written modules (lib/, _rpc, _pty, _events, _server,
# _service, testing) are held to the same rules.
[tool.pyright]
# this enables practically every flag given by pyright.
# there are a couple of flags that are still disabled by
# default in strict mode as they are experimental and niche.
typeCheckingMode = "strict"
pythonVersion = "3.10"

exclude = [
    "_dev",
    ".venv",
    ".nox",
    ".git",
    "codegen",
    "docs",
    "fuzz",
]

reportImplicitOverride = true
reportOverlappingOverload = false

reportImportCycles = false
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "tests/custom"
# respx ships without complete type information, and autouse fixtures are never referenced.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportUnusedFunction = false

[tool.mypy]
pretty = true
show_error_codes = true

# Exclude _files.py because mypy isn't smart enough to apply
# the correct type narrowing and as this is an internal module
# it's fine to just use Pyright.
#
# We also exclude our `tests` as mypy doesn't always infer
# types correctly and Pyright will still catch any type errors.
files = ["src/opencode"]
exclude = ["src/opencode/_files.py", "_dev/.*.py", "tests/.*"]

strict_equality = true
implicit_reexport = true
check_untyped_defs = true
no_implicit_optional = true

warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

# Turn these options off as it could cause conflicts
# with the Pyright options.
warn_unused_ignores = false
warn_redundant_casts = false

disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
cache_fine_grained = true

# By default, mypy reports an error if you assign a value to the result
# of a function call that doesn't return anything. We do this in our test
# cases:
# ```
# result = ...
# assert result is None
# ```
# Changing this codegen to make mypy happy would increase complexity
# and would not be worth it.
disable_error_code = "func-returns-value,overload-cannot-match"

# https://github.com/python/mypy/issues/12162
[[tool.mypy.overrides]]
module = "black.files.*"
ignore_errors = true
ignore_missing_imports = true


[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # isort
  "I",
  # bugbear rules
  "B",
  # remove unused imports
  "F401",
  # check for missing future annotations
  "FA102",
  # bare except statements
  "E722",
  # unused arguments
  "ARG",
  # print statements
  "T201",
  "T203",
  # misuse of typing.TYPE_CHECKING
  "TC004",
  # import rules
  "TID251",
]
ignore = [
  # mutable defaults
  "B006",
]
unfixable = [
  # disable auto fix for print statements
  "T201",
  "T203",
]

extend-safe-fixes = ["FA102"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.lru_cache".msg = "This function does not retain type information for the wrapped function's arguments; The `lru_cache` function from `_utils` should be used instead"

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["opencode", "tests"]

[tool.ruff.lint.per-file-ignores]
"bin/**.py" = ["T201", "T203"]
"scripts/**.py" = ["T201", "T203"]
"examples/**.py" = ["T201", "T203"]
# Signatures set by their callers: pytest fixtures, respx side effects, mkdocs hooks, the fake
# server's route handlers and the PTY resize callback.
"tests/**.py" = ["T201", "T203", "ARG"]
"docs/**.py" = ["ARG"]
"src/opencode/testing.py" = ["ARG002"]
"src/opencode/_pty.py" = ["ARG001", "ARG005"]
