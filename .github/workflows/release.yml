name: Release

# Rolling releases: every merge to main that changes the package is tested, versioned from its
# commits, tagged, published to PyPI and announced as a GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if no package files changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: next
        run: |
          version=$(python3 scripts/next_version.py ${{ inputs.force && '--force' || '' }})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then echo "Next release: v$version"; else echo "No package changes; nothing to release."; fi

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
        run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opencode-python-sdk/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write # trusted publishing, no stored token
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
